<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>ExBot! Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: instrument-panel shell. A quiet left rail of controls beside one working canvas; on phones the rail becomes a bottom tab bar. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#EAF0EE; --ink:#13201E; --muted:#5A6B67; --line:#D6E0DD;
  --accent:#1F6F63; --accent-ink:#FFFFFF; --accent-soft:#D9EEE8; --rec:#BFE2D8;
  --gain:#1D8456; --loss:#C2453A; --warn:#A86A12; --info:#2D5DA8;
  --gain-soft:#DDF2E7; --loss-soft:#F8E1DE; --warn-soft:#F6EAD3; --info-soft:#E0E8F6;
  --danger-ink:#FFFFFF; --track:#D6E0DD;
  --c1:#1F6F63; --c2:#2D5DA8; --c3:#A86A12; --c4:#7A4FA0; --c5:#5A6B67; --c6:#B5487A;
  --shadow:0 1px 2px rgba(19,32,30,.06),0 10px 30px rgba(19,32,30,.08);
  --f-display:"Libre Franklin","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"IBM Plex Sans","Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1413; --surface:#141E1C; --surface-2:#1A2725; --ink:#E4EDEA; --muted:#92A49F; --line:#253430;
  --accent:#53B5A2; --accent-ink:#04211B; --accent-soft:#17382F; --rec:#24574B;
  --gain:#4FC38B; --loss:#EF7B6F; --warn:#E2A64B; --info:#81A8EA;
  --gain-soft:#163226; --loss-soft:#3A1E1B; --warn-soft:#3A2D16; --info-soft:#1B2A44;
  --danger-ink:#2A0B07; --track:#2A3A36;
  --c1:#53B5A2; --c2:#81A8EA; --c3:#E2A64B; --c4:#B58BE0; --c5:#92A49F; --c6:#E28AB2;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1413; --surface:#141E1C; --surface-2:#1A2725; --ink:#E4EDEA; --muted:#92A49F; --line:#253430;
  --accent:#53B5A2; --accent-ink:#04211B; --accent-soft:#17382F; --rec:#24574B;
  --gain:#4FC38B; --loss:#EF7B6F; --warn:#E2A64B; --info:#81A8EA;
  --gain-soft:#163226; --loss-soft:#3A1E1B; --warn-soft:#3A2D16; --info-soft:#1B2A44;
  --danger-ink:#2A0B07; --track:#2A3A36;
  --c1:#53B5A2; --c2:#81A8EA; --c3:#E2A64B; --c4:#B58BE0; --c5:#92A49F; --c6:#E28AB2;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.3); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:26px} h2{font-size:18px} h3{font-size:15px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:12.5px} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.lg{width:22px;height:22px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* shell */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:18px;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding:0 8px}
.brand b{font-family:var(--f-display);font-size:20px;letter-spacing:-.02em}
.navlist{display:flex;flex-direction:column;gap:2px}
.navlist a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:500}
.navlist a:hover{background:var(--surface-2);color:var(--ink)}
.navlist a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.navlist .sep{height:1px;background:var(--line);margin:8px 6px}
.navlist .grp{font-size:11.5px;color:var(--muted);letter-spacing:.06em;padding:6px 10px 2px}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:12.5px}
.inst{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.main{min-width:0;padding-inline:clamp(16px,3vw,36px);padding-block:22px 40px}
.foot{margin-top:36px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:11px;color:var(--muted);text-decoration:none;background:none;border:0;font-family:inherit;cursor:pointer}
.tabbar [aria-current="page"]{color:var(--accent)}
.shell.public{grid-template-columns:1fr}
.shell.public .rail{display:none}
.shell.public ~ .tabbar{display:none!important}
@media (max-width:880px){
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  .tabbar{display:grid}
  .main{padding-bottom:96px}
}

/* top bar */
.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.top .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.top .r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* primitives */
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.cols-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.cols-4{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card.flat{background:var(--bg)}
.card-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;line-height:20px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--gain-soft);color:var(--gain)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--loss-soft);color:var(--loss)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.dot.live{box-shadow:0 0 0 0 currentColor;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 45%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px/1.2 var(--f-body);text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{background:var(--loss);border-color:var(--loss);color:var(--danger-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .v{font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .s{font-size:12.5px;color:var(--muted)}
.gain{color:var(--gain)} .loss{color:var(--loss)} .warnc{color:var(--warn)}
.demo-flag{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px dashed var(--warn);color:var(--warn);border-radius:999px;padding:1px 9px}
.meter{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.warn i{background:var(--warn)} .meter.bad i{background:var(--loss)}
.table-wrap{overflow-x:auto;margin-inline:-4px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:12px;color:var(--muted);text-align:left;font-weight:500;letter-spacing:.02em;white-space:nowrap}
.tbl td,.tbl th{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.num,.tbl th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.sig{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sig i{width:8px;height:8px;border-radius:2px;display:inline-block}
.chart-box{position:relative;height:240px}
.chart-box.tall{height:300px}
.chart-box.short{height:180px}
.fallback{display:grid;place-items:center;height:100%;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:500;font-size:13px}
.input{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:400 14px var(--f-body)}
.input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.check input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.note{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:10px;background:var(--info-soft);color:var(--ink);font-size:13px}
.note .ic{color:var(--info);margin-top:2px}
.note.warn{background:var(--warn-soft)} .note.warn .ic{color:var(--warn)}
.note.ok{background:var(--gain-soft)} .note.ok .ic{color:var(--gain)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--bg);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;font:500 13px var(--f-body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:14px}
.tabs button{border:0;background:none;padding:9px 12px;font:500 13.5px var(--f-body);color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

/* switch */
.sw{position:relative;display:inline-block;width:38px;height:22px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--track);transition:background .15s}
.sw span::after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span::after{transform:translateX(16px)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* strategy builder */
.builder{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1180px){.builder{grid-template-columns:1fr}}
.side-sticky{position:sticky;top:16px;display:flex;flex-direction:column;gap:16px}
@media (max-width:1180px){.side-sticky{position:static}}
.block{border:1px solid var(--line);border-radius:11px;background:var(--surface);transition:border-color .15s}
.block.on{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.block-h{display:flex;gap:12px;align-items:flex-start;padding:13px 14px}
.block-h .bt{min-width:0;flex:1}
.tag{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:4px}
.params{padding:2px 14px 14px;display:flex;flex-direction:column;gap:14px;border-top:1px dashed var(--line);padding-top:12px}
.prow{display:flex;flex-direction:column;gap:6px}
.prow label{font-size:13px;font-weight:500}
.pctl{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:12px;align-items:center}
.pnum{display:flex;align-items:center;gap:6px}
.pnum input{width:72px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px var(--f-mono);text-align:right}
.pnum .unit{font-size:12px;color:var(--muted);white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;margin:8px 0;
  background:linear-gradient(to right,var(--track) 0 var(--a),var(--rec) var(--a) var(--b),var(--track) var(--b) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);cursor:pointer}
.legend-rec{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.legend-rec i{width:22px;height:6px;border-radius:4px;background:var(--rec);display:inline-block}
.prio{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.prio li{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.prio li .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:18px}
.prio li .grow{flex:1;min-width:0}
.iconbtn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.iconbtn[disabled]{opacity:.35;cursor:default}
.checks{display:flex;flex-direction:column;gap:7px;margin:0;padding:0;list-style:none}
.checks li{display:flex;gap:9px;align-items:flex-start;font-size:13px}
.checks .ic{margin-top:2px}
.preview-wrap{position:relative;height:300px}
.preview-wrap canvas{width:100%;height:100%;display:block}
pre.code{margin:0;padding:12px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font:12.5px/1.6 var(--f-mono);overflow:auto;max-height:340px;white-space:pre}
.diff-add{color:var(--gain)} .diff-del{color:var(--loss)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font:500 13px var(--f-body);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;padding-bottom:18px;position:relative}
.tl li::before{content:"";position:absolute;left:9px;top:20px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .mk{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);margin-top:1px}
.tl .mk .ic{width:12px;height:12px;stroke-width:2.6}
.tl .mk.ok{background:var(--gain-soft);color:var(--gain)} .tl .mk.warn{background:var(--warn-soft);color:var(--warn)} .tl .mk.bad{background:var(--loss-soft);color:var(--loss)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:12.5px;margin-top:8px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-mono);overflow-wrap:anywhere}

/* heatmap */
.heat{display:grid;gap:3px;font-size:11.5px;min-width:420px}
.heat .h{color:var(--muted);text-align:center;font-family:var(--f-mono)}
.heat .rl{color:var(--muted);display:flex;align-items:center}
.heat .c{height:34px;border-radius:5px;display:grid;place-items:center;font-family:var(--f-mono);color:var(--ink);background:var(--surface-2)}

/* modal + toast */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,14,13,.48);display:grid;place-items:center;padding:16px}
.sheet{width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px}
@media (max-width:600px){.overlay{place-items:end center;padding:0}.sheet{border-radius:16px 16px 0 0;width:100%;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}}
.toast{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;flex-direction:column;gap:8px;pointer-events:none}
@media (max-width:880px){.toast{left:16px;right:16px;bottom:84px}}
.toast div{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow);animation:tin .2s ease-out}
@keyframes tin{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
.pk{display:grid;place-items:center;gap:12px;padding:10px 0 4px;text-align:center}
.pk svg{width:84px;height:84px}
.pk .ring{fill:none;stroke:var(--line);stroke-width:3}
.pk .arc{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-dasharray:252;stroke-dashoffset:252;animation:arc 1.3s ease-out forwards;transform-origin:50% 50%;transform:rotate(-90deg)}
.pk .face{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.pk.done .arc{stroke:var(--gain);stroke-dashoffset:0;animation:none}
@keyframes arc{to{stroke-dashoffset:0}}

/* auth + landing */
.auth{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:28px;padding-block:8px 24px}
.auth.narrow{max-width:460px}
.brandrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:28px;align-items:center}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.display{font-size:clamp(30px,4.6vw,46px);line-height:1.12;letter-spacing:-.025em}
.lead{font-size:16px;color:var(--muted);max-width:60ch}
.lead strong{color:var(--ink);font-weight:600}
.hero-panel{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.feature .ic{color:var(--accent)}
.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.steps li{counter-increment:s;display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:2px solid var(--line)}
.steps li::before{content:counter(s,decimal-leading-zero);font:500 12px var(--f-mono);color:var(--accent)}
.fine{font-size:12px;color:var(--muted);max-width:80ch}
.otp{display:flex;gap:8px}
.otp input{width:46px;height:54px;text-align:center;font:500 22px var(--f-mono);border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.otp input:focus{outline:2px solid var(--accent);border-color:transparent}
@media (max-width:400px){.otp input{width:40px;height:48px}}
.strength{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.strength i{height:4px;border-radius:4px;background:var(--surface-2)}
.strength.s1 i:nth-child(-n+1){background:var(--loss)}
.strength.s2 i:nth-child(-n+2){background:var(--warn)}
.strength.s3 i:nth-child(-n+3){background:var(--accent)}
.strength.s4 i{background:var(--gain)}

/* onboarding */
.stepper{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;list-style:none;margin:0;padding-left:0}
.stepper li{flex:1 0 118px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.stepper li i{height:4px;border-radius:4px;background:var(--surface-2)}
.stepper li.done i{background:var(--accent)} .stepper li.cur i{background:var(--accent);opacity:.55}
.stepper li.cur{color:var(--ink);font-weight:500}
.browser{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.browser .bar{display:flex;align-items:center;gap:8px;background:var(--surface-2);padding:8px 12px;font:12px var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
.browser .bar .ic{width:14px;height:14px;color:var(--gain)}
.browser .body{padding:16px;display:flex;flex-direction:column;gap:12px}
.codebox{font:600 22px var(--f-mono);letter-spacing:.12em;padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);text-align:center}
.prog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.prog li{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--muted)}
.prog li.done{color:var(--ink)} .prog li.done .mk{background:var(--gain-soft);color:var(--gain)}
.prog li.run .mk{background:var(--accent-soft);color:var(--accent)}
.prog .mk{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2)}
.prog .mk .ic{width:13px;height:13px;stroke-width:2.6}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ops */
.funnel{display:flex;flex-direction:column;gap:8px}
.funnel .fr{display:grid;grid-template-columns:72px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px}
.funnel .fb{height:22px;border-radius:6px;background:var(--accent-soft);position:relative;overflow:hidden}
.funnel .fb i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:6px}
textarea.input{min-height:110px;resize:vertical;line-height:1.6}
.copyout{padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:13.5px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.copyout mark{background:var(--loss-soft);color:var(--loss);border-radius:4px;padding:0 2px}
.bigstop{display:flex;align-items:center;gap:14px;padding:18px;border-radius:14px;border:1px solid color-mix(in srgb,var(--loss) 45%,var(--line));background:var(--loss-soft)}
.bigstop .btn{margin-left:auto}
.coach{position:fixed;inset:0;z-index:70}
.coach .hole{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(8,14,13,.58);outline:2px solid var(--accent);outline-offset:2px;pointer-events:none;transition:left .25s ease,top .25s ease,width .25s ease,height .25s ease}
.coach .tip{position:fixed;width:min(350px,calc(100vw - 24px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;transition:left .25s ease,top .25s ease}
.coach .tip p{color:var(--muted);font-size:13.5px}
.coach .ctrl{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.coach .dots{display:flex;gap:5px}
.coach .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.coach .dots i.on{background:var(--accent)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

function tzParts(ts,tz){const f=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',weekday:'short'});const o={};for(const p of f.formatToParts(new Date(ts)))o[p.type]=p.value;return o}

    for(let j=0;j<k;j++){
      let x=r(),type='breakout';for(const[ty,w]of types){if(x<w){type=ty;break}x-=w}
      let ny=type==='orb'?570+Math.floor(r()*45):600+Math.floor(r()*340);while(used.has(Math.floor(ny/20)))ny+=23;if(ny>955)ny=610+Math.floor(r()*200);used.add(Math.floor(ny/20));
      const ts=zonedToUtc(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate(),Math.floor(ny/60),ny%60,'America/New_York');
      const dir=r()<.52?1:-1,win=r()<pWin[type],stop=type==='mr'?25:60,tgt=type==='mr'?18+Math.round(r()*20):90;let pts,reason,hold;
      if(r()<.07){pts=Math.round(randn(r)*18);reason='eod';hold=40+Math.floor(r()*120)}else if(win){pts=tgt;reason='tp';hold=14+Math.floor(r()*80)}else{pts=-stop;reason='sl';hold=4+Math.floor(r()*55)}

    bars.push({o,c,h:Math.max(o,c)+Math.abs(randn(r))*2.2,l:Math.min(o,c)-Math.abs(randn(r))*2.2})}return bars}

/* ============ indicators + preview simulation ============ */
function ema(a,p){const k=2/(p+1),o=[];let e=a[0];for(let i=0;i<a.length;i++){e=i?a[i]*k+e*(1-k):a[0];o.push(e)}return o}
function wilderAtr(b,p){const o=new Array(b.length).fill(NaN);let s=0;for(let i=1;i<b.length;i++){const t=Math.max(b[i].h-b[i].l,Math.abs(b[i].h-b[i-1].c),Math.abs(b[i].l-b[i-1].c));if(i<=p){s+=t;if(i===p)o[i]=s/p}else o[i]=(o[i-1]*(p-1)+t)/p}return o}
function adx(b,p){const n=b.length,o=new Array(n).fill(0);let tr_=0,pd=0,md=0,ad=0;const dx=[];
  for(let i=1;i<n;i++){const up=b[i].h-b[i-1].h,dn=b[i-1].l-b[i].l,P=up>dn&&up>0?up:0,M=dn>up&&dn>0?dn:0,t=Math.max(b[i].h-b[i].l,Math.abs(b[i].h-b[i-1].c),Math.abs(b[i].l-b[i-1].c));
    if(i<=p){tr_+=t;pd+=P;md+=M}else{tr_=tr_-tr_/p+t;pd=pd-pd/p+P;md=md-md/p+M}
    if(i>=p&&tr_>0){const pi=100*pd/tr_,mi=100*md/tr_,x=pi+mi?100*Math.abs(pi-mi)/(pi+mi):0;if(dx.length<p){dx.push(x);ad=dx.reduce((a,c)=>a+c,0)/dx.length}else ad=(ad*(p-1)+x)/p;o[i]=ad}}return o}
function boll(a,p,k){const up=[],lo=[],mid=[];for(let i=0;i<a.length;i++){if(i<p-1){up.push(NaN);lo.push(NaN);mid.push(NaN);continue}let s=0;for(let j=i-p+1;j<=i;j++)s+=a[j];const m=s/p;let v=0;for(let j=i-p+1;j<=i;j++)v+=(a[j]-m)**2;const sd=Math.sqrt(v/p);mid.push(m);up.push(m+k*sd);lo.push(m-k*sd)}return{up,lo,mid}}
function rsi(a,p){const o=new Array(a.length).fill(50);let g=0,l=0;for(let i=1;i<a.length;i++){const d=a[i]-a[i-1],G=Math.max(d,0),L=Math.max(-d,0);if(i<=p){g+=G;l+=L;if(i===p){g/=p;l/=p}}else{g=(g*(p-1)+G)/p;l=(l*(p-1)+L)/p}if(i>=p)o[i]=l===0?100:100-100/(1+g/l)}return o}

function simulate(st,bars){
  const n=bars.length,c=bars.map(b=>b.c),sg=st.signals,f=st.filters,e=ema(c,sg.trend.ema),atr=wilderAtr(bars,14);
  const ad=f.adx.on?adx(bars,f.adx.period):null,bb=sg.mr.on?boll(c,sg.mr.period,sg.mr.k):null;
  const ef=sg.cross.on?ema(c,sg.cross.fast):null,es=sg.cross.on?ema(c,sg.cross.slow):null,rs=sg.rsi.on?rsi(c,sg.rsi.period):null;
  const rb=sg.orb.rangeMin*4,wb=sg.orb.window*4;let rh=-Infinity,rl=Infinity;for(let i=0;i<Math.min(rb,n);i++){rh=Math.max(rh,bars[i].h);rl=Math.min(rl,bars[i].l)}
  const orbOk=sg.orb.on&&rh-rl>=sg.orb.minRange;let orbDone=false,mrCount=0,opened=0;
  const markers=[],exits=[];let pos=null,cool=-1,raw=0,trades=0,wins=0;const lastBy={};
  const side=(i,d)=>d>0?c[i]>e[i]&&c[i]-e[i]>=sg.trend.dist:c[i]<e[i]&&e[i]-c[i]>=sg.trend.dist;
  const streak=(i,d)=>{for(let j=i-sg.trend.bars+1;j<=i;j++){if(j<0||!side(j,d))return false}return true};
  for(let i=30;i<n;i++){
    const b=bars[i];
    if(pos){let hit=0,px=0;if(pos.d>0){if(b.l<=pos.sl){hit=-1;px=pos.sl}else if(b.h>=pos.tp){hit=1;px=pos.tp}}else{if(b.h>=pos.sl){hit=-1;px=pos.sl}else if(b.l<=pos.tp){hit=1;px=pos.tp}}
      if(!hit&&st.exit.time.on&&(i-pos.i)>=st.exit.time.min*4){hit=(c[i]-pos.px)*pos.d>0?1:-1;px=c[i]}
      if(hit){exits.push({i,p:px,w:hit>0});trades++;if(hit>0)wins++;
        if(hit<0&&f.cooldown.on){const tre=ad?ad[i]>=f.adx.th:true;cool=i+(tre?f.cooldown.trend:f.cooldown.chop)*4}pos=null;continue}}
    const trending=ad?ad[i]>=f.adx.th:true,choppy=ad?ad[i]<f.adx.th:true,cand={},body=Math.abs(b.c-b.o);
    if(sg.trend.on&&trending){for(const d of[1,-1])if(streak(i,d)&&!streak(i-1,d))cand.trend=d}
    if(sg.breakout.on&&trending&&i>sg.breakout.look){let hh=-Infinity,ll=Infinity;for(let j=i-sg.breakout.look;j<i;j++){hh=Math.max(hh,bars[j].h);ll=Math.min(ll,bars[j].l)}
      if(b.c>hh&&b.c>b.o&&body>=sg.breakout.body&&b.c-e[i]>=sg.breakout.dist)cand.breakout=1;else if(b.c<ll&&b.c<b.o&&body>=sg.breakout.body&&e[i]-b.c>=sg.breakout.dist)cand.breakout=-1}
    if(orbOk&&!orbDone&&i>=rb&&i<rb+wb){if(b.c>rh&&body>=sg.orb.body)cand.orb=1;else if(b.c<rl&&body>=sg.orb.body)cand.orb=-1}
    if(bb&&choppy&&i>=sg.mr.warm&&mrCount<sg.mr.maxPer&&isFinite(bb.lo[i-1])){if(c[i-1]<bb.lo[i-1]&&c[i]>bb.lo[i])cand.mr=1;else if(c[i-1]>bb.up[i-1]&&c[i]<bb.up[i])cand.mr=-1}
    if(ef){if(ef[i-1]<=es[i-1]&&ef[i]>es[i])cand.cross=1;else if(ef[i-1]>=es[i-1]&&ef[i]<es[i])cand.cross=-1}
    if(rs){if(rs[i-1]<sg.rsi.lo&&rs[i]>=sg.rsi.lo)cand.rsi=1;else if(rs[i-1]>sg.rsi.hi&&rs[i]<=sg.rsi.hi)cand.rsi=-1}
    const keys=Object.keys(cand);raw+=keys.length;
    if(!pos&&i>=cool&&keys.length&&!(f.cap.on&&opened>=f.cap.max)){
      const pk=st.priority.find(k=>cand[k]!==undefined);if(!pk)continue;
      if(f.gap.on&&lastBy[pk]!==undefined&&(i-lastBy[pk])*15<f.gap.sec)continue;
      const d=cand[pk],a=isFinite(atr[i])?atr[i]:8;

const enabledSignals=st=>Object.keys(st.signals).filter(k=>st.signals[k].on);
function checks(st,sim){
  const L=[],x=st.exit,sg=enabledSignals(st);
  if(!sg.length)L.push(['bad',tr('至少启用一个入场信号。','Turn on at least one entry signal.')]);
  if(x.mode==='points'){const be=x.stop/(x.stop+x.target),be2=(x.stop+1)/(x.stop+x.target);
    L.push(['info',tr(`保本胜率约 ${fmtPct(be)};计入 1 点点差后约 ${fmtPct(be2)}。胜率长期低于这个数,策略就会亏损。`,`Break-even win rate is about ${fmtPct(be)}, or ${fmtPct(be2)} after a 1-point spread. A lower win rate over time means losses.`)]);
    if(x.stop<4)L.push(['bad',tr('止损小于券商的最小止损距离(示例 4 点,实际以你账户查询为准)。','Stop is below the broker minimum stop distance (4 pts in this example; your account sets the real value).')]);
    if(x.target/x.stop<.8)L.push(['warn',tr('止盈明显小于止损,需要很高的胜率才能保本。','Target is much smaller than the stop, so you need a very high win rate to break even.')])}
  else L.push(['info',tr('止损止盈按 ATR 倍数计算,会随波动率自动放大或缩小。','Stop and target follow ATR, so they widen and narrow with volatility.')]);
  const cnt=sg.length+Object.values(st.filters).filter(f=>f.on).length;
  L.push(cnt>7?['warn',tr(`当前启用了 ${cnt} 个积木。条件越多,越容易只适合过去的行情。`,`${cnt} blocks are on. More conditions make it easier to fit only past markets.`)]:['ok',tr(`启用了 ${cnt} 个积木,在建议的 7 个以内。`,`${cnt} blocks on, within the suggested 7.`)]);
  const perDay=Math.round(sim.raw*(1560/sim.n));
  L.push(perDay>40?['warn',tr(`按预览估算,每天约产生 ${perDay} 次原始信号,交易成本和误触发会偏高。`,`The preview suggests about ${perDay} raw signals a day, which means higher costs and more false triggers.`)]:['ok',tr(`按预览估算,每天约产生 ${perDay} 次原始信号。`,`The preview suggests about ${perDay} raw signals a day.`)]);
  if(st.signals.mr.on&&!st.filters.adx.on)L.push(['warn',tr('均值回归在单边行情里会逆势亏损,建议同时启用"趋势 / 震荡切换"。','Mean reversion loses against strong trends. Turn on the trend / range switch as well.')]);
  if(st.signals.cross.on&&st.signals.cross.fast>=st.signals.cross.slow)L.push(['bad',tr('均线交叉的快线周期必须小于慢线周期。','The fast MA period must be shorter than the slow MA period.')]);
  if(st.signals.rsi.on&&st.signals.rsi.lo>=st.signals.rsi.hi)L.push(['bad',tr('RSI 超卖线必须低于超买线。','The oversold level must be below the overbought level.')]);
  if(st.signals.breakout.on&&!st.filters.cooldown.on)L.push(['warn',tr('动量突破未设置亏损后冷却,连续止损时可能密集入场。','Breakout has no cooldown after a loss, so it can re-enter quickly after repeated stops.')]);
  L.push(['ok',tr('"斜率确认"与"连续同侧"在数学上重复,已合并,不再单独提供。','"Slope confirmation" duplicates "bars on the same side" mathematically, so it is merged and not offered separately.')]);
  return L;
}

  if(!COACH||!COACH.tg)return;const r=COACH.tg.n.getBoundingClientRect(),pad=6,hole=COACH.el.querySelector('.hole'),tip=COACH.el.querySelector('.tip');

/* ---------- strategy builder ---------- */
function paramRow(path){const m=PARAMS[path],v=getP(S.strategy,path),a=(m.rec[0]-m.min)/(m.max-m.min)*100,b=(m.rec[1]-m.min)/(m.max-m.min)*100,id='p-'+path.replace(/\./g,'-'),u=pick(m.u);
  return `<div class="prow"><label for="${id}">${pick(m.l)} <span class="muted small">· ${tr('推荐','suggested')} ${m.rec[0]}–${m.rec[1]}${u?' '+u:''}</span></label>
  <div class="pctl"><input type="range" id="${id}" data-path="${path}" min="${m.min}" max="${m.max}" step="${m.step}" value="${v}" style="--a:${a}%;--b:${b}%">
  <div class="pnum"><input type="number" id="${id}-n" data-path="${path}" min="${m.min}" max="${m.max}" step="${m.step}" value="${v}" aria-label="${pick(m.l)}"><span class="unit">${u}</span></div></div>
  <div data-hint="${path}">${hintFor(path,v)}</div></div>`}
function hintFor(path,v){const m=PARAMS[path];return(v<m.rec[0]||v>m.rec[1])?`<span class="pill warn">${ic('alert')}${tr('超出推荐区间。允许使用,提交时会再次提示。','Outside the suggested range. Allowed, and flagged again when you submit.')}</span>`:''}
function blockCard([key,title,desc,ps,tag]){const on=getP(S.strategy,key+'.on'),id='t-'+key.replace(/\./g,'-');
  return `<div class="block ${on?'on':''}" data-block="${key}"><div class="block-h"><span class="sw"><input type="checkbox" id="${id}" data-toggle="${key}.on" ${on?'checked':''} aria-label="${pick(title)}"><span></span></span>
   <div class="bt"><label for="${id}" style="cursor:pointer"><b>${pick(title)}</b></label><span class="tag">${tag}</span><p class="muted small">${pick(desc)}</p></div></div>

   <div class="note warn" style="margin-top:12px">${ic('alert')}<span>${tr('C-1004 已 36 分钟未报到。运营方无法远程登录,需联系客户在其 AWS 控制台查看。','C-1004 has not checked in for 36 minutes. We cannot sign in remotely, so we ask the client to check their AWS console.')}</span></div></section>
  <section class="stack" style="gap:16px">
   <div class="card"><div class="card-h"><h2>${tr('客户进度','Client pipeline')}</h2></div><div class="funnel">${[[['咨询','Enquiry'],14],[['已签约','Signed'],8],[['实施中','Setting up'],7],[['运行中','Running'],5]].map(([l,v])=>`<div class="fr"><span>${pick(l)}</span><span class="fb"><i style="width:${v/14*100}%"></i></span><span class="mono">${v}</span></div>`).join('')}</div></div>
   <div class="card"><div class="card-h"><h2>${tr('运行时版本分布','Runtime versions')}</h2><span class="small muted">${tr('客户自行选择何时更新','Clients choose when to update')}</span></div><div class="chart-box short"><canvas id="o-ver" aria-label="${tr('运行时版本分布','Runtime versions')}"></canvas></div></div>
  </section></div>
 <section class="card" style="margin-top:16px"><div class="card-h"><div class="stack" style="gap:2px"><span class="eyebrow">${tr('运营待办','Operations')}</span><h2>${tr('策略、合规、财务与渠道','Strategy, compliance, finance and referrals')}</h2></div></div>
  <div class="grid cols-2">
   <div class="stack"><h3>${tr('待办','To do')}</h3>
    ${[[['策略模板说明','Strategy template notes'],['示例模板"多信号组合"v3 的参数说明待补充','Parameter notes for the "Multi-signal" v3 sample'],['2 项','2'],'warn'],[['文案与告知文本','Marketing and notices'],['推广文案 3 篇待审;客户风险告知文本 1 份待律师意见','3 marketing drafts to review; 1 risk notice awaiting legal input'],['4 项','4'],'warn'],[['财务对账','Reconciliation'],['安装费发票 7 张:5 已收,2 待收;订阅价待定','7 setup invoices: 5 paid, 2 due; subscription price not set'],['2 项','2'],'info'],[['渠道沟通','Referrals'],['3 位潜在客户待首次沟通','3 prospects waiting for a first call'],['3 项','3'],'info'],[['律师咨询','Legal advice'],['问题清单已整理,待预约','Question list ready, appointment not booked'],['待预约','To book'],'bad']].map(([a,b,c,d])=>`<div class="card flat row" style="justify-content:space-between"><div class="stack" style="gap:0;min-width:0"><b class="small">${pick(a)}</b><span class="small muted">${pick(b)}</span></div><span class="pill ${d}">${pick(c)}</span></div>`).join('')}</div>
   <div class="stack"><h3>${tr('推广文案检查','Marketing copy check')}</h3><p class="small muted">${tr('发布前检查是否出现收益承诺、未经验证的业绩或个人化建议。','Check drafts for promised returns, unverified performance or personal advice before posting.')}</p>
    <textarea class="input" id="cp-in" aria-label="${tr('待检查的文案','Copy to check')}">${tr('用规则代替情绪:在可视化界面里组合你的交易规则,机器人在你自己的服务器上执行。我们的策略高胜率、稳定盈利,跟着买就行。','Rules instead of emotions: build your trading rules visually and let the bot run them on your own server. Our strategy has a high win rate and steady profit, guaranteed.')}</textarea>
    <div class="copyout" id="cp-out"></div><ul class="checks" id="cp-list"></ul></div></div></section>`},
 mount(){const T=themeColors(),o=baseOpts(T,v=>v+tr(' 台',' servers'));o.indexAxis='y';o.scales.x.grid={color:T.line};o.scales.y.grid={display:false};o.scales.y.ticks={callback:function(v){return this.getLabelForValue(v)}};o.scales.x.ticks={stepSize:1};
  mkChart($('#o-ver'),{type:'bar',data:{labels:['v1.3.2','v1.3.1','v1.3.0'],datasets:[{data:[4,1,0],backgroundColor:[T.accent,rgba(T.accent,.55),rgba(T.accent,.3)],borderRadius:5,maxBarThickness:28}]},options:o});
  const inp=$('#cp-in'),run=()=>{const txt=inp.value,low=txt.toLowerCase();let h=esc(txt);const hits=[];
    for(const[w,zh,en]of BANNED){const i=low.indexOf(w.toLowerCase());if(i>=0){hits.push([w,LANG==='en'?en:zh]);const re=new RegExp(esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');h=h.replace(re,m=>`<mark>${m}</mark>`)}}
    $('#cp-out').innerHTML=h||`<span class="muted">${tr('在上面输入文案。','Type copy above.')}</span>`;
    $('#cp-list').innerHTML=hits.length?hits.map(([w,why])=>`<li><span class="loss">${ic('x')}</span><span>"${esc(w)}": ${why}${tr(',不可使用。','. Do not use.')}</span></li>`).join(''):`<li><span class="gain">${ic('check')}</span><span>${tr('没有发现禁用表述。发布前仍需人工复核。','No blocked phrases found. Someone still reviews it before posting.')}</span></li>`};
  inp.addEventListener('input',run);run()}};

/* ============ boot ============ */
document.documentElement.lang=LANG==='en'?'en':'zh-CN';
window.addEventListener('hashchange',render);
const mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',()=>render());
new MutationObserver(()=>render()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
render();
</script>
